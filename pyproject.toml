[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "breacheye"
version = "0.1.0"
description = "Safe control harness for Ryze/DJI Tello drone experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
hardware = [
    "djitellopy>=2.5",
    "opencv-python>=4.9",
]
test = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
rafa = [
    "pyzmq>=26.0",
    "msgpack>=1.0",
    "numpy>=1.26",
    "opencv-python>=4.9",
]

[project.scripts]
breacheye = "breacheye.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["breacheye*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "."]
testpaths = ["tests"]
